[program:jenkins]
command=/opt/ci/jenkins/start-jenkins.sh
directory=/opt/ci/jenkins/home
user=jenkins
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=60
stopsignal=TERM
redirect_stderr=false
stdout_logfile=/opt/ci/logs/jenkins.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/opt/ci/logs/jenkins.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=JENKINS_HOME="/opt/ci/jenkins/home",LANG="en_US.UTF-8",JENKINS_HTTP_PORT="8080"
