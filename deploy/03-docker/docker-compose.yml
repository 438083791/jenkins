# 方案三：GitLab + Jenkins（JDK21）同一 Compose 网络；Jenkins 可 docker build / run 部署应用
services:
  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce:17.11.0-ce.0}
    hostname: ${GITLAB_HOSTNAME:-gitlab.local}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME:-gitlab.local}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}
    ports:
      - "${GITLAB_HTTP_PORT:-80}:80"
      - "${GITLAB_SSH_PORT:-2222}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_data:/var/opt/gitlab
      - gitlab_logs:/var/log/gitlab
    shm_size: "256m"
    networks: [ci-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/-/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  jenkins:
    build:
      context: ./jenkins
    image: ${JENKINS_IMAGE_NAME:-my-project-jenkins:scheme03}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Pipeline 冒烟/常驻容器加入同一 Docker 网络后，用容器名访问
      JENKINS_DOCKER_NETWORK: ${JENKINS_DOCKER_NETWORK:-ci-net}
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # 使用宿主机 Docker Engine（Maven docker agent / docker build / docker run 部署）
      # 安全风险：等同授予容器操控宿主机 Docker 的权限；实验环境可用
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    networks: [ci-net]
    restart: unless-stopped

networks:
  ci-net:
    name: ${COMPOSE_NETWORK_NAME:-ci-net}
    driver: bridge

volumes:
  gitlab_config:
  gitlab_data:
  gitlab_logs:
  jenkins_home:
