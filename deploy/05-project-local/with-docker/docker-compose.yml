services:
  jenkins:
    build: .
    image: my-project-jenkins:with-docker
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dcasc.jenkins.config=/var/jenkins_home/casc_configs
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_home/casc_configs:ro
      # 挂载整个仓库，Pipeline 可直接看到 web-test/
      - ../../../:/workspace/project
      # 使用宿主机 Docker Engine（docker agent / docker build）
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    restart: unless-stopped

volumes:
  jenkins_home:
